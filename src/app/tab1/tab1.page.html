<!--
  Se usan las directivas estructurales clasicas (*ngFor) de forma intencional,
  ya que el enunciado de la practica pide hacer uso de templates de Angular.
-->
<!-- eslint-disable @angular-eslint/template/prefer-control-flow -->

<app-toolbar title="Tab 1: Inicio" />

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-card class="app-card app-card--accent bienvenida-card">
    <ion-card-header>
      <ion-card-title>¡Bienvenido(a) a mi app!</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <div class="presentado-por">
        <span class="presentado-por-label">Presentado por</span>
        <strong class="presentado-por-nombre">{{ fullName }}</strong>
        <span class="presentado-por-carrera">{{ academicDegree }}</span>
      </div>

      <p class="mensaje-estudiante">{{ welcomeMessage }}</p>

      <h3 class="lista-titulo">Contenido de cada pestaña</h3>

      <ion-list lines="none" class="temas-list">
        <ion-item *ngFor="let tema of topics">
          <ion-icon slot="start" [name]="tema.icono" [color]="tema.color"></ion-icon>
          <ion-label>
            <h3>{{ tema.titulo }}</h3>
            <p>{{ tema.descripcion }}</p>
          </ion-label>
        </ion-item>
      </ion-list>

      <ion-note class="firma">
        Práctica — Desarrollo Multiplataforma · Ionic + Angular
      </ion-note>
    </ion-card-content>
  </ion-card>
</ion-content>
